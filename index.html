<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    
    <!-- Elegant fonts for quotes and UI -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #f4f5f7; 
            color: #2d3748; 
        }
        
        /* Hero Section */
        .hero-card { 
            padding: 40px; 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 16px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            margin-bottom: 40px; 
            border: 1px solid #e2e8f0;
        }
        
        .hero-card h2 { 
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 24px;
            color: #1a202c;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .hero-card p { 
            color: #718096; 
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        
        .generate-btn { 
            padding: 12px 28px; 
            background: #4f46e5; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 15px;
            margin-top: 20px; 
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        
        .generate-btn:hover { background: #4338ca; }
        .generate-btn:active { transform: scale(0.98); }

        /* History Section */
        h3 { 
            font-size: 18px; 
            color: #4a5568; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .history-item { 
            padding: 20px; 
            background: white; 
            border-left: 4px solid #4f46e5; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .quote-content {
            flex-grow: 1;
        }

        .quote-text {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            color: #2d3748;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .quote-author {
            font-size: 13px;
            color: #718096;
            font-weight: 600;
        }

        .delete-btn {
            background: #fff0f2;
            color: #e53e3e;
            border: 1px solid #fed7d7;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #e53e3e;
            color: white;
            border-color: #e53e3e;
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <h2 id="quoteText">"Click below to fetch a piece of wisdom."</h2>
        <p id="quoteAuthor"></p>
        <button class="generate-btn" onclick="generateQuote()">Fetch Random Quote</button>
    </div>

    <h3>Saved History</h3>
    <div id="historyList"></div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function generateQuote() {
            try {
                // Fetch from the backend
                const res = await fetch(`${API_URL}/new-quote`);
                const data = await res.json();
                
                // Update the UI Hero section
                document.getElementById('quoteText').textContent = `"${data.quote}"`;
                document.getElementById('quoteAuthor').textContent = `- ${data.author}`;
                
                // Refresh the history list
                loadHistory();
            } catch (error) {
                alert('Ensure your Node server is running.');
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(`${API_URL}/history`);
                const history = await res.json();
                
                // Map the data to HTML structure including the Delete button
                document.getElementById('historyList').innerHTML = history.map(item => 
                    `<div class="history-item">
                        <div class="quote-content">
                            <div class="quote-text">"${item.quote}"</div>
                            <div class="quote-author">- ${item.author}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteQuote(${item.id})">Delete</button>
                    </div>`
                ).join('');
            } catch (error) {
                console.error('Failed to load history:', error);
            }
        }

        // NEW: Function to delete a quote
        async function deleteQuote(id) {
            try {
                const res = await fetch(`${API_URL}/history/${id}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    // Reload the history to visually remove the deleted item
                    loadHistory();
                } else {
                    alert('Failed to delete quote.');
                }
            } catch (error) {
                console.error('Error deleting quote:', error);
            }
        }

        // Load existing history on initial page load
        loadHistory();
    </script>
</body>
</html>
